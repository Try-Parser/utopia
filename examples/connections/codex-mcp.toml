# Merge deliberately into your local configuration; no secrets required.
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@0.0.83", "--headless", "--isolated", "--browser", "chrome"]
enabled_tools = ["browser_navigate", "browser_snapshot", "browser_click", "browser_take_screenshot", "browser_close"]
startup_timeout_sec = 60
tool_timeout_sec = 60
